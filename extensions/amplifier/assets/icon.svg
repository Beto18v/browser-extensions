<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Fondo transparente -->
  <!-- Anillo exterior delgado de guía -->
  <circle cx="64" cy="64" r="54" fill="none" stroke="#2E3744" stroke-width="3"/>
  <!-- Dial interior oscuro pizarra con borde fino terracota -->
  <circle cx="64" cy="64" r="46" fill="#1B2028" stroke="#E05A47" stroke-width="3.5"/>
  <!-- Ondas sonoras de amplificación intercaladas (arco exterior terracota intenso, arco medio terracota claro durazno, arco interior terracota medio) -->
  <path d="M 34 64 A 30 30 0 0 1 94 64" fill="none" stroke="#E05A47" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 42 64 A 22 22 0 0 1 86 64" fill="none" stroke="#F6A89E" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 50 64 A 14 14 0 0 1 78 64" fill="none" stroke="#E05A47" stroke-width="3" stroke-linecap="round"/>
  <!-- Aguja indicadora hacia el nivel de boost en terracota claro para resaltar -->
  <line x1="64" y1="64" x2="80" y2="40" stroke="#F6A89E" stroke-width="4" stroke-linecap="round"/>
  <!-- Centro / eje en terracota principal -->
  <circle cx="64" cy="64" r="7" fill="#E05A47"/>
</svg>
