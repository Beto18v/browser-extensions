<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Amplifier — Web Store Promo Generator (1280x800)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0b0d11; color: #fff; padding: 30px; display: flex; flex-direction: column; align-items: center; }
    h1 { font-size: 20px; margin-bottom: 8px; color: #E05A47; }
    p { font-size: 14px; color: #94a3b8; margin-bottom: 20px; }
    .controls { display: flex; gap: 12px; margin-bottom: 24px; flex-wrap: wrap; }
    button { background: #1B2028; border: 1px solid #334155; color: #f1f5f9; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500; transition: all 0.2s; }
    button:hover { border-color: #E05A47; background: #222933; }
    button.active { background: #E05A47; border-color: #E05A47; color: white; }
    .btn-download { background: #22c55e; border-color: #16a34a; color: #000; font-weight: 600; margin-left: 20px; }
    .btn-download:hover { background: #4ade80; border-color: #22c55e; }
    .canvas-container { border: 2px solid #1e293b; border-radius: 8px; overflow: hidden; box-shadow: 0 20px 40px rgba(0,0,0,0.6); max-width: 100%; }
    canvas { display: block; max-width: 100%; height: auto; }
  </style>
</head>
<body>
  <h1>Generador de Capturas para Chrome Web Store (1280 × 800)</h1>
  <p>Elige una escena y pulsa "Descargar PNG" para obtener la captura en resolución oficial exacta.</p>

  <div class="controls">
    <button class="active" onclick="renderSlide(0)">1. Volumen 600% (Hero)</button>
    <button onclick="renderSlide(1)">2. Presets & Ecualizador</button>
    <button onclick="renderSlide(2)">3. Gestión Multitaña</button>
    <button class="btn-download" onclick="downloadImage()">Descargar PNG (1280x800)</button>
  </div>

  <div class="canvas-container">
    <canvas id="promoCanvas" width="1280" height="800"></canvas>
  </div>

  <script>
    const canvas = document.getElementById('promoCanvas');
    const ctx = canvas.getContext('2d');
    let currentSlide = 0;

    const slides = [
      {
        tag: "MAXIMUM AMPLIFICATION",
        title: "Boost Audio up to 600%",
        subtitle: "Break the limits of quiet videos and low-volume streams with zero distortion.",
        volume: 350,
        preset: "normal",
        limiter: true
      },
      {
        tag: "AUDIO EQUALIZATION",
        title: "Fine-Tuned Tone Presets",
        subtitle: "Clarity for dialogue, punchy bass for music, and compressed dynamics for night listening.",
        volume: 200,
        preset: "bass",
        limiter: true
      },
      {
        tag: "SMART MULTI-TAB CONTROL",
        title: "Control Sound Across Tabs",
        subtitle: "Per-site volume memory and instant mute for background audio with a single click.",
        volume: 180,
        preset: "voice",
        limiter: true
      }
    ];

    function drawCard(x, y, w, h, radius, fill, stroke) {
      ctx.beginPath();
      ctx.roundRect(x, y, w, h, radius);
      if (fill) { ctx.fillStyle = fill; ctx.fill(); }
      if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 1; ctx.stroke(); }
    }

    function renderSlide(index) {
      currentSlide = index;
      document.querySelectorAll('.controls button:not(.btn-download)').forEach((btn, i) => {
        btn.classList.toggle('active', i === index);
      });

      const s = slides[index];

      // 1. Fondo general de 1280x800 (Acoustic Slate Gradient)
      const grad = ctx.createLinearGradient(0, 0, 1280, 800);
      grad.addColorStop(0, '#101318');
      grad.addColorStop(0.5, '#151922');
      grad.addColorStop(1, '#0C0E12');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 1280, 800);

      // Glow sutil en el fondo
      const glow = ctx.createRadialGradient(850, 420, 50, 850, 420, 500);
      glow.addColorStop(0, 'rgba(224, 90, 71, 0.12)');
      glow.addColorStop(1, 'rgba(224, 90, 71, 0)');
      ctx.fillStyle = glow;
      ctx.fillRect(0, 0, 1280, 800);

      // 2. Columna izquierda: Textos y valor
      ctx.textAlign = 'left';
      
      // Tag pill
      drawCard(100, 220, 240, 32, 16, 'rgba(224, 90, 71, 0.15)', '#E05A47');
      ctx.fillStyle = '#E05A47';
      ctx.font = '600 12px -apple-system, sans-serif';
      ctx.fillText(s.tag, 120, 241);

      // Título
      ctx.fillStyle = '#FFFFFF';
      ctx.font = '700 46px -apple-system, sans-serif';
      ctx.fillText(s.title, 100, 315);

      // Subtítulo
      ctx.fillStyle = '#94A3B8';
      ctx.font = '400 20px -apple-system, sans-serif';
      const words = s.subtitle.split(' ');
      let line = '';
      let lineY = 365;
      for (let n = 0; n < words.length; n++) {
        let testLine = line + words[n] + ' ';
        if (ctx.measureText(testLine).width > 480 && n > 0) {
          ctx.fillText(line, 100, lineY);
          line = words[n] + ' ';
          lineY += 32;
        } else {
          line = testLine;
        }
      }
      ctx.fillText(line, 100, lineY);

      // Beneficios en viñetas
      const bullets = [
        "Up to 600% volume boost",
        "Hardware limiter anti-clipping",
        "100% private, local-first engine"
      ];
      lineY += 45;
      bullets.forEach(b => {
        // Dot terracotta
        ctx.fillStyle = '#E05A47';
        ctx.beginPath();
        ctx.arc(108, lineY, 4, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#CBD5E1';
        ctx.font = '500 16px -apple-system, sans-serif';
        ctx.fillText(b, 124, lineY + 5);
        lineY += 30;
      });

      // 3. Columna derecha: Mockup fiel del Popup de Amplifier (340x540)
      const px = 760;
      const py = 130;
      const pw = 360;
      const ph = 540;

      // Sombra exterior pronunciada
      ctx.shadowColor = 'rgba(0, 0, 0, 0.6)';
      ctx.shadowBlur = 30;
      ctx.shadowOffsetY = 15;
      drawCard(px, py, pw, ph, 16, '#181D24', '#2D3542');
      ctx.shadowColor = 'transparent';

      // Header del popup
      // Logo circular
      ctx.fillStyle = '#1B2028';
      ctx.beginPath();
      ctx.arc(px + 36, py + 36, 16, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#E05A47';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      // Brand text
      ctx.fillStyle = '#F8FAFC';
      ctx.font = '700 17px -apple-system, sans-serif';
      ctx.fillText('Amplifier', px + 62, py + 42);

      // Idioma selector mockup (bandera US)
      drawCard(px + pw - 78, py + 24, 30, 24, 4, '#222933', '#334155');
      ctx.fillStyle = '#AA151B';
      ctx.fillRect(px + pw - 74, py + 28, 22, 16);
      ctx.fillStyle = '#F1BF00';
      ctx.fillRect(px + pw - 74, py + 32, 22, 8);

      // Theme toggle icon
      drawCard(px + pw - 42, py + 24, 26, 24, 4, '#222933', '#334155');
      ctx.fillStyle = '#94A3B8';
      ctx.font = '12px sans-serif';
      ctx.fillText('☼', px + pw - 34, py + 40);

      // Caja de Volumen Central
      drawCard(px + 20, py + 75, pw - 40, 160, 12, '#13161C', '#222832');

      // Número grande
      ctx.fillStyle = '#FFFFFF';
      ctx.font = '800 48px -apple-system, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(s.volume + '%', px + (pw / 2), py + 135);

      // VU Meter de 12 bloques
      const meterY = py + 155;
      const totalBlocks = 12;
      const litBlocks = Math.round((s.volume / 600) * totalBlocks);
      const blockW = (pw - 80) / totalBlocks;

      for (let i = 0; i < totalBlocks; i++) {
        const bx = px + 40 + (i * blockW);
        let bColor = '#242B35';
        if (i < litBlocks) {
          if (i < 4) bColor = '#60A5FA';
          else if (i < 8) bColor = '#E05A47';
          else bColor = '#EF4444';
        }
        drawCard(bx + 1, meterY, blockW - 2, 8, 2, bColor, null);
      }

      // Slider track
      const sliderY = py + 185;
      drawCard(px + 40, sliderY, pw - 80, 6, 3, '#2A323F', null);
      const fillW = ((s.volume / 600) * (pw - 80));
      drawCard(px + 40, sliderY, fillW, 6, 3, '#E05A47', null);
      // Thumb
      ctx.fillStyle = '#FFFFFF';
      ctx.beginPath();
      ctx.arc(px + 40 + fillW, sliderY + 3, 9, 0, Math.PI * 2);
      ctx.fill();

      // Quick jump pills (100%, 200%, 300%, 600%)
      const pills = [100, 200, 300, 600];
      const pillW = (pw - 60) / 4;
      pills.forEach((p, i) => {
        const pillX = px + 25 + (i * (pillW + 4));
        const isCurrent = Math.abs(s.volume - p) < 50;
        drawCard(pillX, py + 250, pillW, 28, 6, isCurrent ? '#E05A47' : '#1F252F', isCurrent ? '#E05A47' : '#2D3542');
        ctx.fillStyle = isCurrent ? '#FFFFFF' : '#94A3B8';
        ctx.font = '600 12px -apple-system, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(p + '%', pillX + (pillW / 2), py + 268);
      });

      // Presets Heading
      ctx.textAlign = 'left';
      ctx.fillStyle = '#64748B';
      ctx.font = '700 11px -apple-system, sans-serif';
      ctx.fillText('TONE PRESETS', px + 25, py + 305);

      // Presets Grid (2x2)
      const presetList = [
        { id: 'normal', name: 'Normal', desc: 'Flat sound' },
        { id: 'voice', name: 'Voice', desc: '+9dB dialog' },
        { id: 'bass', name: 'Bass', desc: '+11dB punch' },
        { id: 'night', name: 'Night', desc: 'Compressed' }
      ];

      presetList.forEach((pr, i) => {
        const col = i % 2;
        const row = Math.floor(i / 2);
        const bx = px + 25 + (col * ((pw - 58) / 2 + 8));
        const by = py + 318 + (row * 48);
        const bw = (pw - 58) / 2;
        const isSel = pr.id === s.preset;

        drawCard(bx, by, bw, 42, 6, isSel ? 'rgba(224, 90, 71, 0.12)' : '#1B2028', isSel ? '#E05A47' : '#28313D');

        ctx.fillStyle = isSel ? '#E05A47' : '#F1F5F9';
        ctx.font = '600 13px -apple-system, sans-serif';
        ctx.fillText(pr.name, bx + 10, by + 18);

        ctx.fillStyle = '#64748B';
        ctx.font = '400 11px -apple-system, sans-serif';
        ctx.fillText(pr.desc, bx + 10, by + 34);
      });

      // Limiter toggle row
      const limY = py + 430;
      drawCard(px + 25, limY, pw - 50, 42, 6, '#1B2028', '#28313D');
      ctx.fillStyle = '#F1F5F9';
      ctx.font = '500 13px -apple-system, sans-serif';
      ctx.fillText('Anti-Clipping Limiter', px + 37, limY + 26);

      // Switch
      drawCard(px + pw - 65, limY + 12, 32, 18, 9, '#E05A47', null);
      ctx.fillStyle = '#FFFFFF';
      ctx.beginPath();
      ctx.arc(px + pw - 43, limY + 21, 7, 0, Math.PI * 2);
      ctx.fill();

      // Footer branding
      ctx.fillStyle = '#475569';
      ctx.font = '400 11px -apple-system, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('Amplifier by Nicolas Valenzuela', px + (pw / 2), py + 510);
    }

    function downloadImage() {
      const link = document.createElement('a');
      link.download = `amplifier-screenshot-${currentSlide + 1}-1280x800.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    }

    // Render inicial
    renderSlide(0);
  </script>
</body>
</html>
