<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#3730a3" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="m-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)" />

  <!-- Subtle Inner Border -->
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="4" />

  <!-- Markdown Stylized Symbol Container with Filter -->
  <g filter="url(#shadow)">
    <!-- Document Badge Background -->
    <rect x="64" y="96" width="384" height="320" rx="40" fill="#0f172a" fill-opacity="0.45" stroke="#818cf8" stroke-opacity="0.3" stroke-width="3" />

    <!-- Stylized 'M' Letterform -->
    <path d="M 120 340 L 120 172 L 176 264 L 232 172 L 232 340" fill="none" stroke="url(#m-grad)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" />

    <!-- AI Sparkle / Arrow Pointer -->
    <path d="M 336 172 L 336 292 M 288 248 L 336 296 L 384 248" fill="none" stroke="url(#accent-grad)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
