<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RecordFlow</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="popup-wrapper">
      <!-- Header -->
      <header class="header">
        <div class="brand">
          <div class="brand-icon">
            <span class="rec-dot-header"></span>
          </div>
          <div class="brand-text">
            <span class="title">RecordFlow</span>
            <span class="badge" data-i18n="unlimited_badge">100% Local • Ilimitado</span>
          </div>
        </div>
        <div class="header-actions">
          <button id="btn-hardware-settings" class="btn-icon-header" title="Configurar Cámara y Micrófono">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
          <nival-lang-switch></nival-lang-switch>
        </div>
      </header>

      <!-- Tab Navigation -->
      <nav class="nav-tabs">
        <button id="tab-record-btn" class="nav-tab active">
          <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 8-6 4 6 4V8Z"/><rect width="14" height="12" x="2" y="6" rx="2" ry="2"/></svg>
          <span data-i18n="tab_record">Grabador</span>
        </button>
        <button id="tab-recent-btn" class="nav-tab">
          <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 8 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg>
          <span data-i18n="tab_recent">Grabaciones</span> <span id="recordings-count-badge" class="count-pill">0</span>
        </button>
      </nav>

      <!-- View 1: Recorder Panel -->
      <main id="view-record" class="view-panel active">
        <!-- Status indicator bar -->
        <div id="status-bar" class="status-bar ready">
          <div class="status-indicator">
            <span class="status-dot"></span>
            <span id="status-text" data-i18n="status_ready">Listo para grabar</span>
          </div>
          <div id="live-timer-badge" class="live-timer hidden">
            <svg class="timer-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            <span id="live-timer-text">00:00</span>
          </div>
        </div>

        <!-- Mode Selector -->
        <div class="section-group">
          <label class="section-label" data-i18n="meta_mode">Modo de grabación</label>
          <div class="mode-grid">
            <button class="mode-card active" data-mode="screen-camera" id="mode-screen-camera">
              <span class="mode-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="11" x="1" y="3" rx="2"/><line x1="4" x2="12" y1="18" y2="18"/><line x1="8" x2="8" y1="14" y2="18"/><rect width="7" height="6" x="15" y="11" rx="1.5"/><path d="m22 12.5 1.5-1v5l-1.5-1"/></svg>
              </span>
              <span class="mode-name" data-i18n="mode_screen_camera">Pantalla + Cámara</span>
            </button>
            <button class="mode-card" data-mode="screen" id="mode-screen">
              <span class="mode-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="14" x="2" y="3" rx="2"/><line x1="8" x2="16" y1="21" y2="21"/><line x1="12" x2="12" y1="17" y2="21"/></svg>
              </span>
              <span class="mode-name" data-i18n="mode_screen_only">Solo Pantalla</span>
            </button>
            <button class="mode-card" data-mode="camera" id="mode-camera">
              <span class="mode-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>
              </span>
              <span class="mode-name" data-i18n="mode_camera_only">Solo Cámara</span>
            </button>
          </div>
          <p id="mode-description" class="mode-caption" data-i18n="mode_screen_camera_desc">
            Graba la pantalla con tu cámara en burbuja circular flotante.
          </p>
        </div>

        <!-- Audio Configuration -->
        <div class="section-group">
          <div class="switch-row">
            <div class="switch-info">
              <span class="switch-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></svg>
              </span>
              <div class="switch-texts">
                <span class="switch-title" data-i18n="audio_mic_label">Micrófono</span>
                <span id="mic-status-label" class="switch-subtitle" data-i18n="audio_mic_active">Activo</span>
              </div>
            </div>
            <label class="toggle">
              <input type="checkbox" id="mic-toggle" checked />
              <span class="slider"></span>
            </label>
          </div>
        </div>

        <!-- Pin Launcher Toggle -->
        <div class="section-group">
          <div class="switch-row">
            <div class="switch-info">
              <span class="switch-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" x2="12" y1="17" y2="22"></line><path d="M5 17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V6h1a2 2 0 0 0 0-4H8a2 2 0 0 0 0 4h1v4.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24Z"></path></svg>
              </span>
              <div class="switch-texts">
                <span class="switch-title">Fijar botón en webs</span>
                <span id="pin-launcher-label" class="switch-subtitle">Opcional</span>
              </div>
            </div>
            <label class="toggle">
              <input type="checkbox" id="pin-launcher-toggle" />
              <span class="slider"></span>
            </label>
          </div>
        </div>

        <!-- Error / Warning Banner -->
        <div id="error-banner" class="alert-banner hidden">
          <span class="alert-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" x2="12" y1="9" y2="13"/><line x1="12" x2="12.01" y1="17" y2="17"/></svg>
          </span>
          <span id="error-message" class="alert-text"></span>
        </div>

        <!-- Prominent Record Action Button -->
        <div class="action-container">
          <button id="record-cta-btn" class="btn-cta btn-start">
            <span class="cta-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="4" fill="currentColor"/></svg>
            </span>
            <span id="cta-label" data-i18n="launch_floating_studio">Abrir Estudio en Pantalla</span>
          </button>
        </div>
      </main>

      <!-- View 2: Recent Recordings Panel -->
      <main id="view-recent" class="view-panel hidden">
        <div id="recent-list-container" class="recent-list">
          <!-- Populated dynamically -->
        </div>

        <div id="recent-empty" class="empty-state hidden">
          <span class="empty-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m22 8-6 4 6 4V8Z"/><rect width="14" height="12" x="2" y="6" rx="2" ry="2"/></svg>
          </span>
          <h4 data-i18n="no_recordings_title">No hay grabaciones guardadas</h4>
          <p data-i18n="no_recordings_desc">
            Tus videos se guardan 100% en tu navegador, sin límites ni nubes de terceros.
          </p>
        </div>
      </main>

      <!-- Footer Branding -->
      <footer class="footer">
        <nival-footer></nival-footer>
      </footer>
    </div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
