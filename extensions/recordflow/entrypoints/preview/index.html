<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RecordFlow Studio — Vista Previa</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="studio-layout">
      <!-- Studio Header -->
      <header class="studio-header">
        <div class="header-brand">
          <div class="brand-badge">
            <span class="rec-dot"></span>
            <span class="brand-name">RecordFlow Studio</span>
          </div>
          <div class="feature-pills">
            <span class="pill" data-i18n="unlimited_badge">100% Local • Ilimitado</span>
            <span class="pill highlight" data-i18n="preview_format">WebM HD</span>
          </div>
        </div>

        <div class="header-right">
          <nival-lang-switch></nival-lang-switch>
        </div>
      </header>

      <!-- Main Stage -->
      <main class="studio-main">
        <div class="stage-grid">
          <!-- Video Player Column -->
          <section class="player-column">
            <div class="video-container">
              <video id="video-player" controls autoplay playsinline class="video-element"></video>
              <div id="video-loader" class="video-loader">
                <div class="spinner"></div>
                <span data-i18n="preview_player_title">Cargando grabación...</span>
              </div>
            </div>

            <!-- Video Playback & Studio Controls Bar -->
            <div class="playback-controls-card">
              <div class="speed-control-group">
                <span class="speed-label-text">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                  <span data-i18n="playback_speed">Velocidad</span>
                </span>
                <div class="speed-pills">
                  <button type="button" class="btn-speed" data-speed="0.75">0.75x</button>
                  <button type="button" class="btn-speed active" data-speed="1">1x</button>
                  <button type="button" class="btn-speed" data-speed="1.25">1.25x</button>
                  <button type="button" class="btn-speed" data-speed="1.5">1.5x</button>
                  <button type="button" class="btn-speed" data-speed="2">2x</button>
                </div>
              </div>
            </div>

            <!-- Video Title Bar -->
            <div class="video-title-card">
              <div class="title-group">
                <input type="text" id="recording-title-input" class="title-input" spellcheck="false" />
                <span class="edit-hint">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/><path d="m15 5 4 4"/></svg>
                </span>
              </div>
              <div class="video-metrics">
                <span class="metric-pill" id="metric-duration"></span>
                <span class="metric-pill" id="metric-size"></span>
                <span class="metric-pill" id="metric-mode"></span>
                <span class="metric-pill" id="metric-date"></span>
              </div>
            </div>
          </section>

          <!-- Actions & Control Sidebar -->
          <aside class="sidebar-column">
            <div class="action-card">
              <h3 class="card-heading" data-i18n="preview_file_details">Acciones de Video</h3>

              <div class="actions-stack">
                <!-- Primary Download MP4 Button -->
                <button id="btn-download-mp4" class="action-btn btn-primary btn-mp4">
                  <span class="btn-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
                  </span>
                  <span id="label-download-mp4" data-i18n="btn_download_mp4">Descargar Video (.mp4)</span>
                  <span class="format-pill-tag tag-mp4">MP4</span>
                </button>

                <!-- Download WebM Button -->
                <button id="btn-download-webm" class="action-btn btn-secondary btn-webm">
                  <span class="btn-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
                  </span>
                  <span id="label-download-webm" data-i18n="btn_download_webm">Descargar Video (.webm)</span>
                  <span class="format-pill-tag tag-webm">WebM</span>
                </button>

                <!-- Copy Blob Link -->
                <button id="btn-copy" class="action-btn btn-secondary">
                  <span class="btn-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/></svg>
                  </span>
                  <span id="copy-label" data-i18n="btn_copy_link">Copiar Enlace Local</span>
                </button>

                <!-- Record New Video -->
                <button id="btn-record-new" class="action-btn btn-secondary">
                  <span class="btn-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 8-6 4 6 4V8Z"/><rect width="14" height="12" x="2" y="6" rx="2" ry="2"/></svg>
                  </span>
                  <span data-i18n="btn_record_new">Grabar Nuevo Video</span>
                </button>

                <hr class="divider" />

                <!-- Delete Action -->
                <button id="btn-delete" class="action-btn btn-danger">
                  <span class="btn-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg>
                  </span>
                  <span data-i18n="btn_delete">Eliminar Grabación</span>
                </button>
              </div>
            </div>

            <!-- Privacy Guarantee Box -->
            <div class="privacy-card">
              <div class="privacy-header">
                <span class="shield-icon">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/></svg>
                </span>
                <h4 data-i18n="loom_alt">Alternativa Libre a Loom</h4>
              </div>
              <p data-i18n="no_recordings_desc">
                Tus grabaciones se procesan y almacenan 100% en tu máquina. Cero límites de tiempo, sin marcas de agua y sin nube de terceros.
              </p>
            </div>
          </aside>
        </div>

        <!-- Saved Recordings Library -->
        <section class="library-section">
          <div class="library-header">
            <h3 data-i18n="preview_all_recordings">Tus Grabaciones Guardadas</h3>
            <span id="library-count" class="library-badge">0 videos</span>
          </div>

          <div id="library-grid" class="library-grid">
            <!-- Populated dynamically -->
          </div>
        </section>
      </main>

      <!-- Footer Branding -->
      <footer class="studio-footer">
        <nival-footer></nival-footer>
      </footer>
    </div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
