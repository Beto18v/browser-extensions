<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Configuración de Hardware — RecordFlow</title>
    <style>
      :root {
        --accent-color: #6366f1;
        --accent-hover: #4f46e5;
        --bg-main: #0b0f19;
        --bg-card: rgba(17, 24, 39, 0.85);
        --border-card: rgba(255, 255, 255, 0.1);
        --text-primary: #f9fafb;
        --text-secondary: #9ca3af;
        --success: #10b981;
        --danger: #ef4444;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }

      body {
        background-color: var(--bg-main);
        color: var(--text-primary);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background-image: 
          radial-gradient(circle at 15% 15%, rgba(99, 102, 241, 0.15) 0%, transparent 40%),
          radial-gradient(circle at 85% 85%, rgba(168, 85, 247, 0.12) 0%, transparent 40%);
      }

      .setup-container {
        width: 100%;
        max-width: 520px;
        background: var(--bg-card);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1.5px solid var(--border-card);
        border-radius: 24px;
        padding: 32px 28px;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.65), 0 0 30px rgba(99, 102, 241, 0.2);
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      .header {
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
      }

      .logo-icon {
        width: 48px;
        height: 48px;
        border-radius: 14px;
        background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0 20px rgba(99, 102, 241, 0.5);
      }

      .logo-icon svg {
        width: 26px;
        height: 26px;
        stroke: #ffffff;
      }

      h1 {
        font-size: 20px;
        font-weight: 800;
        letter-spacing: -0.02em;
      }

      p.subtitle {
        font-size: 13.5px;
        color: var(--text-secondary);
        line-height: 1.45;
      }

      .preview-box {
        position: relative;
        width: 100%;
        height: 220px;
        background: #030712;
        border-radius: 18px;
        overflow: hidden;
        border: 1.5px solid var(--border-card);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transform: scaleX(-1);
      }

      .preview-placeholder {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        color: var(--text-secondary);
        font-size: 13px;
      }

      .device-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      label {
        font-size: 12px;
        font-weight: 700;
        color: var(--text-secondary);
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      select {
        width: 100%;
        padding: 10px 14px;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid var(--border-card);
        border-radius: 12px;
        color: var(--text-primary);
        font-size: 13.5px;
        outline: none;
        cursor: pointer;
        transition: border-color 0.15s ease;
      }

      select:focus {
        border-color: var(--accent-color);
      }

      .btn-primary {
        width: 100%;
        padding: 14px;
        background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
        color: #ffffff;
        font-size: 14.5px;
        font-weight: 700;
        border: none;
        border-radius: 14px;
        cursor: pointer;
        box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
        transition: all 0.2s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }

      .btn-primary:hover {
        transform: translateY(-1.5px);
        box-shadow: 0 6px 20px rgba(99, 102, 241, 0.6);
      }

      .status-pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 10px;
        border-radius: 9999px;
        font-size: 11.5px;
        font-weight: 700;
        background: rgba(16, 185, 129, 0.15);
        color: var(--success);
        border: 1px solid rgba(16, 185, 129, 0.3);
      }

      .status-pill.error {
        background: rgba(239, 68, 68, 0.15);
        color: var(--danger);
        border-color: rgba(239, 68, 68, 0.3);
      }
    </style>
  </head>
  <body>
    <div class="setup-container">
      <div class="header">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m22 8-6 4 6 4V8Z"></path>
            <rect width="14" height="12" x="2" y="6" rx="2" ry="2"></rect>
          </svg>
        </div>
        <h1>Configuración de Hardware</h1>
        <p class="subtitle">Concede permiso global a la extensión para detectar tu cámara (ej. POCO X8 Pro) y micrófono sin bloqueos.</p>
        <div id="status-pill" class="status-pill">
          <span>●</span> <span id="status-text">Listo para activar</span>
        </div>
      </div>

      <div class="preview-box">
        <video id="preview-video" autoplay muted playsinline></video>
        <div id="preview-placeholder" class="preview-placeholder">
          <span>Haz clic en "Activar Cámara y Micrófono" para previsualizar</span>
        </div>
      </div>

      <div class="device-group">
        <label for="camera-select">Cámara Seleccionada</label>
        <select id="camera-select">
          <option value="">(Cámara predeterminada)</option>
        </select>
      </div>

      <div class="device-group">
        <label for="mic-select">Micrófono Seleccionado</label>
        <select id="mic-select">
          <option value="">(Micrófono predeterminado)</option>
        </select>
      </div>

      <button id="btn-request" class="btn-primary">
        Activar Cámara y Micrófono
      </button>
    </div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
