name: Release Extension

on:
  push:
    tags:
      - '*@*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Parse Tag Information
        id: parse_tag
        run: |
          TAG_NAME="${{ github.ref_name }}"
          # Expected format: <extension-name>@<version> (e.g. md-for-ai@0.1.0)
          EXT_NAME="${TAG_NAME%@*}"
          EXT_VERSION="${TAG_NAME#*@}"

          echo "tag=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "extension=$EXT_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$EXT_VERSION" >> "$GITHUB_OUTPUT"

          if [ ! -d "extensions/$EXT_NAME" ]; then
            echo "::error::Target directory extensions/$EXT_NAME not found!"
            exit 1
          fi

          echo "Triggering release for extension: $EXT_NAME at version: $EXT_VERSION"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build & Package Extension
        run: |
          EXT="${{ steps.parse_tag.outputs.extension }}"
          pnpm --filter "$EXT" run build
          pnpm --filter "$EXT" run zip

      - name: Collect Output Zip
        run: |
          EXT="${{ steps.parse_tag.outputs.extension }}"
          mkdir -p releases
          find "extensions/$EXT/.output" -name "*.zip" -exec cp {} releases/ \;
          ls -la releases/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.parse_tag.outputs.tag }}
          name: "${{ steps.parse_tag.outputs.extension }} v${{ steps.parse_tag.outputs.version }}"
          files: releases/*.zip
          draft: false
          prerelease: false
          generate_release_notes: true
